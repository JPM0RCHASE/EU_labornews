name: Blog Explainer (네이버 실무 해설글)

on:
  workflow_dispatch:
    inputs:
      topic:
        description: '비워두면 주제 후보 3개를 발송. 후보 번호(1~3) 또는 직접 쓴 주제를 넣으면 해설글을 씁니다.'
        required: false
        default: ''

jobs:
  generate-explainer:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 레포지토리 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          pip install anthropic requests json-repair playwright
          playwright install chromium --with-deps

      - name: 해설글 생성 및 텔레그램 발송
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          TOPIC:              ${{ inputs.topic }}
        run: python generate_explainer.py

      - name: GitHub에 자동 커밋
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Actions"
          git add explainer/
          git diff --staged --quiet || git commit -m "Auto: $(date +'%Y%m%d') 해설글 생성"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
